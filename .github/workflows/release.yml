name: release
run-name: release kukicha @ ${{ inputs.ref || github.sha }}

# main への push で zip を Release として公開し、設定があれば配備側に知らせる。
# 配備はこのリポジトリの外で、配備側が Release を拾って行う。workflow_dispatch は main 上の古いコミットの出し直し用。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 公開する ref(main、または main 上のコミット SHA)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build the release zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sha=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "::error::$sha is not a commit on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=r${RUN_NUMBER}-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - run: pipx install uv==0.13.5

      - run: uv sync --frozen && uv run --frozen pytest

      # venv とモデルは入れない。GPU 機の prepare.ps1 が uv.lock から作る
      - name: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          mkdir stage
          git archive HEAD src deploy pyproject.toml uv.lock .python-version README.md LICENSE | tar -x -C stage
          jq -n --arg version "$VERSION" --arg commit "$SHA" '{version: $version, commit: $commit}' > stage/release.json
          (cd stage && zip -qr ../kukicha-win-x64.zip .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kukicha-zip
          path: kukicha-win-x64.zip
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    # 承認者を付けておけば、承認されるまで Release は公開されず配備側にも届かない
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.build.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kukicha-zip

      - run: bash .github/scripts/publish.sh

      - run: bash .github/scripts/prune.sh 3

  # DEPLOYER_* の secret がなければ何もしない(fork はここで止まる)。
  # 配備側のワークフローを起こすだけで結果は待たない。承認と結果は配備側が扱う。
  notify:
    name: notify the deployer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYER_REPO: ${{ secrets.DEPLOYER_REPO }}
      DEPLOYER_WORKFLOW: ${{ secrets.DEPLOYER_WORKFLOW }}
    steps:
      - id: repo
        if: env.DEPLOYER_REPO != '' && env.DEPLOYER_WORKFLOW != ''
        run: |
          if [[ ! "$DEPLOYER_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::DEPLOYER_REPO must be owner/name"
            exit 1
          fi
          echo "owner=${DEPLOYER_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DEPLOYER_REPO#*/}" >> "$GITHUB_OUTPUT"

      - id: token
        if: steps.repo.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOYER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-actions: write

      - if: steps.repo.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run "$DEPLOYER_WORKFLOW" -R "$DEPLOYER_REPO" --ref main
